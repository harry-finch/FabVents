[package]
name = "fabvents-desktop"
description = "Application de bureau FabVents (Tauri) : interface embarquée, fenêtres natives d'ouverture et d'enregistrement, fichiers récents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fabvents-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Activée par le CLI Tauri pour les builds de distribution.
custom-protocol = ["tauri/custom-protocol"]
