[package]
name = "fabvents-core"
description = "Moteur de motifs de perforation FabVents : dispositions, contrôleurs, mesures, exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
i_overlay = "9.1.0"
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
svgtypes = "0.16.1"
# Dispositions scriptées : bac à sable, sans horloge (déterministe, WebAssembly).
rhai = { version = "1.20", default-features = false, features = ["std", "no_time", "no_module", "no_custom_syntax", "no_closure", "only_i64"] }
