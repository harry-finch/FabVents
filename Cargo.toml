[workspace]
resolver = "3"
members = ["crates/fabvents-core", "crates/fabvents-wasm"]

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Le moteur compilé en WebAssembly : taille raisonnable, calcul rapide.
[profile.release.package.fabvents-wasm]
opt-level = 3
